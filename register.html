            <a href="register.html" class="btn btn-primary">Sign Up</a>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-header-icon"><i class="fas fa-user-plus"></i></div>
                <h1>Create Account</h1>
                <p>Start earning by testing websites</p>
            </div>
            <div id="flashMessages" class="flash-messages"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" class="form-input" placeholder="John" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" class="form-input" placeholder="Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="john@example.com" required>
                </div>
                <div class="form-group" style="margin-bottom:10px;">
                    <label class="checkbox-label" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                        <input type="checkbox" id="terms" required style="width:18px;height:18px;accent-color:#017CC3;">
                        <span style="font-size:0.9rem;color:#9ca3af;">I agree to the <a href="terms.html" style="color:#017CC3;text-decoration:underline;">Terms of Service</a></span>
                    </label>
                </div>
                <button type="submit" class="btn-auth">Create Account</button>
            </form>
            <div class="auth-footer">
                Already have an account? <a href="register.html" style="color:#017CC3;">Sign In</a>
            </div>
        </div>
    </div>
